[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "azure-resource-ops"
version = "0.1.0"
description = "Offline Azure tag merge plans and explicitly scoped application"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=9.0", "ruff>=0.15"]

[project.scripts]
azure-resource-ops = "azure_resource_ops.cli:main"

[tool.setuptools.packages.find]
include = ["azure_resource_ops"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
